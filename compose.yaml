x-app: &app
  build: .
  environment: &environment
    DATABASE_URL: postgresql+psycopg://jobagent:${POSTGRES_PASSWORD:-local_demo_only}@db:5432/${POSTGRES_DB:-jobagent}
    DEMO_MODE: ${DEMO_MODE:-true}
    ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    LLM_PROVIDER: ${LLM_PROVIDER:-openrouter}
    LLM_MODEL: ${LLM_MODEL:-openai/gpt-4o}
    OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    OPENROUTER_SITE_URL: ${OPENROUTER_SITE_URL:-http://localhost:8000}
    OPENROUTER_APP_NAME: ${OPENROUTER_APP_NAME:-Fieldwork Executive Job Agent}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    LLM_INPUT_PRICE: ${LLM_INPUT_PRICE:-0}
    LLM_OUTPUT_PRICE: ${LLM_OUTPUT_PRICE:-0}
    SMTP_HOST: ${SMTP_HOST:-}
    SMTP_PORT: ${SMTP_PORT:-587}
    SMTP_USERNAME: ${SMTP_USERNAME:-}
    SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    SMTP_FROM: ${SMTP_FROM:-}
    SMTP_STARTTLS: ${SMTP_STARTTLS:-true}

services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: jobagent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_demo_only}
      POSTGRES_DB: ${POSTGRES_DB:-jobagent}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobagent -d ${POSTGRES_DB:-jobagent}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  init:
    <<: *app
    command: ["python", "-m", "app.bootstrap"]
    depends_on:
      db:
        condition: service_healthy
  web:
    <<: *app
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3
    restart: unless-stopped
  worker:
    <<: *app
    command: ["python", "-m", "app.worker"]
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped
volumes:
  database:
