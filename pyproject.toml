[project]
name = "european-job-agent"
version = "0.1.0"
description = "Private, evidence-led European executive job discovery"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4", "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1", "beautifulsoup4>=4.13,<5", "pypdf>=5,<7",
  "httpx>=0.28,<1", "tzdata>=2025.1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "playwright>=1.51,<2"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
markers = ["postgres: requires TEST_DATABASE_URL", "live: explicitly enabled external smoke test"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
